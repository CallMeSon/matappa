<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>I La Galigo — Naskah Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: narasi + daftar 12 bagian, tanpa frame -->
  <section id="home">
    <div class="intro">
      <h1 id="home-title"></h1>
      <div id="home-text"></div>
    </div>
    <div class="parts-scroll">
      <div class="parts" id="parts"></div>
    </div>
  </section>

  <!-- Book viewer, memenuhi layar; latar (background) diatur di style.css -->
  <div class="layout">

    <main class="stage">
      <section id="reader" class="screen active">
        <div id="book-wrap"><div id="book"></div></div>
        <div id="slider-row">
          <input id="page-slider" type="range" min="1" max="1" step="1" value="1" aria-label="Geser ke halaman">
        </div>
        <nav class="controls">
          <button id="btn-close" class="ctl">Kembali</button>
          <button id="btn-first" class="ctl" aria-label="Ke halaman awal">&#124;&#9664;</button>
          <button id="btn-prev" class="ctl" aria-label="Halaman sebelumnya">&#9664;</button>
          <button id="page-info" class="ctl" aria-label="Pilih nomor halaman">–</button>
          <button id="btn-next" class="ctl" aria-label="Halaman berikutnya">&#9654;</button>
          <button id="btn-last" class="ctl" aria-label="Ke halaman akhir">&#9654;&#124;</button>
        </nav>

        <!-- Papan angka di layar untuk lompat ke nomor halaman -->
        <div id="goto" class="goto hidden" role="dialog" aria-label="Lompat ke halaman">
          <div class="goto-card">
            <div class="goto-display"><span id="goto-val"></span><span id="goto-total"></span></div>
            <div class="goto-pad" id="goto-pad">
              <button class="ctl" data-k="1">1</button><button class="ctl" data-k="2">2</button><button class="ctl" data-k="3">3</button>
              <button class="ctl" data-k="4">4</button><button class="ctl" data-k="5">5</button><button class="ctl" data-k="6">6</button>
              <button class="ctl" data-k="7">7</button><button class="ctl" data-k="8">8</button><button class="ctl" data-k="9">9</button>
              <button class="ctl" data-k="back" aria-label="Hapus">&#9003;</button><button class="ctl" data-k="0">0</button><button class="ctl goto-go" data-k="go">Buka</button>
            </div>
            <button id="goto-cancel" class="ctl">Batal</button>
          </div>
        </div>
      </section>

      <div id="status" class="status hidden">
        <p id="status-text"></p>
        <button id="status-back" class="ctl" hidden>Kembali</button>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="naskah/parts.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
