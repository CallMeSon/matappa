<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>I La Galigo — Naskah Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="cover">
  <!-- Latar brand bersama untuk layar 01–03: lingkaran dan kapal samar. -->
  <div class="brand-bg" aria-hidden="true">
    <img class="bg-circle" src="assets/lingkaran.svg" alt="">
    <img class="bg-ship" src="assets/kapal.svg" alt="">
  </div>

  <!-- 01 Judul: layar awal dan layar idle. Sentuh di mana saja untuk lanjut. -->
  <section id="cover" class="view" aria-label="Layar awal">
    <div class="deco" aria-hidden="true">
      <img class="d-stripe-top"    src="assets/garis-pink.svg" alt="">
      <img class="d-x-lav"         src="assets/x-lavender.svg" alt="">
      <img class="d-motif-r"       src="assets/motif-kuning.svg" alt="">
      <img class="d-dot-r"         src="assets/titik-hijau.svg" alt="">
      <img class="d-stripe-r"      src="assets/garis-pink-kanan.svg" alt="">
      <img class="d-squiggle"      src="assets/squiggle.svg" alt="">
      <img class="d-stripe-l"      src="assets/garis-pink-kiri.svg" alt="">
      <img class="d-x-green"       src="assets/x-hijau.svg" alt="">
      <img class="d-motif-l"       src="assets/motif-kuning.svg" alt="">
      <img class="d-stripe-bottom" src="assets/garis-pink.svg" alt="">
    </div>
    <img class="logo-indika" src="assets/logo-indika.svg" alt="Indika Foundation">
    <div class="cover-brand">
      <img class="logo-matappa" src="assets/logo-matappa.svg" alt="Matappa Festival">
      <img class="badge-tanggal" src="assets/badge-tanggal.svg" alt="Makassar, 15 Oktober 2026">
    </div>
    <h1 class="cover-title rule" id="cover-title"></h1>
    <p class="cover-hint" id="cover-hint"></p>
  </section>

  <!-- 02 Info: foto naskah + penjelasan. -->
  <section id="about" class="view" aria-label="Tentang naskah">
    <div class="deco" aria-hidden="true">
      <img class="d-stripe-top"    src="assets/garis-pink.svg" alt="">
      <img class="d-x-lav"         src="assets/x-lavender.svg" alt="">
      <img class="d-motif-r"       src="assets/motif-kuning.svg" alt="">
      <img class="d-dot-r"         src="assets/titik-hijau.svg" alt="">
      <img class="d-stripe-r"      src="assets/garis-pink-kanan.svg" alt="">
      <img class="d-squiggle"      src="assets/squiggle.svg" alt="">
      <img class="d-x-green"       src="assets/x-hijau.svg" alt="">
      <img class="d-motif-l"       src="assets/motif-kuning.svg" alt="">
      <img class="d-stripe-bottom" src="assets/garis-pink.svg" alt="">
    </div>
    <div class="corner-brand">
      <img class="logo-indika" src="assets/logo-indika.svg" alt="Indika Foundation">
      <img class="logo-matappa" src="assets/logo-matappa.svg" alt="Matappa Festival">
    </div>
    <h2 class="view-title rule" id="about-title"></h2>
    <div class="about-body">
      <figure class="about-photo" id="about-photo">
        <img alt="" draggable="false">
        <figcaption id="about-photo-label"></figcaption>
      </figure>
      <div class="about-text">
        <div class="about-scroll" id="about-text"></div>
        <button id="btn-start" class="cta"></button>
      </div>
    </div>
  </section>

  <!-- 03 Daftar bagian: narasi + 12 bagian langsung di atas latar brand. -->
  <section id="home" class="view" aria-label="Pilih bagian">
    <div class="deco" aria-hidden="true">
      <img class="d-stripe-top"    src="assets/garis-pink.svg" alt="">
      <img class="d-x-lav"         src="assets/x-lavender.svg" alt="">
      <img class="d-motif-r"       src="assets/motif-kuning.svg" alt="">
      <img class="d-dot-r"         src="assets/titik-hijau.svg" alt="">
      <img class="d-squiggle"      src="assets/squiggle.svg" alt="">
      <img class="d-stripe-l"      src="assets/garis-pink-kiri.svg" alt="">
      <img class="d-x-green"       src="assets/x-hijau.svg" alt="">
      <img class="d-motif-l"       src="assets/motif-kuning.svg" alt="">
      <img class="d-stripe-bottom" src="assets/garis-pink.svg" alt="">
    </div>
    <img class="logo-indika" src="assets/logo-indika.svg" alt="Indika Foundation">
    <header class="home-head">
      <img class="logo-matappa" src="assets/logo-matappa.svg" alt="Matappa Festival">
      <p class="view-title rule" id="home-thanks"></p>
    </header>
    <div class="home-body">
      <div class="intro">
        <h2 id="home-title"></h2>
        <div id="home-text"></div>
      </div>
      <div class="parts-scroll">
        <div class="parts" id="parts"></div>
      </div>
    </div>
  </section>

  <!-- Tombol Beranda: kembali ke layar awal dari layar Tentang dan daftar bagian. -->
  <button id="btn-home" class="ctl btn-home" aria-label="Kembali ke layar awal"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>

  <!-- Book viewer, memenuhi layar; latar (background) diatur di style.css -->
  <div class="layout">
    <!-- Hiasan di kolom tombol kiri-kanan buku; di belakang buku dan tombol. -->
    <div class="deco reader-deco" aria-hidden="true">
      <img class="d-x-lav"    src="assets/x-lavender.svg" alt="">
      <img class="d-stripe-r" src="assets/garis-pink-kanan.svg" alt="">
      <img class="d-dot-r"    src="assets/titik-hijau.svg" alt="">
      <img class="d-squiggle" src="assets/squiggle.svg" alt="">
      <img class="d-stripe-l" src="assets/garis-pink-kiri.svg" alt="">
      <img class="d-x-green"  src="assets/x-hijau.svg" alt="">
      <img class="d-motif-l"  src="assets/motif-kuning.svg" alt="">
    </div>

    <main class="stage">
      <section id="reader" class="screen active">
        <div id="book-wrap"><div id="book"></div></div>
        <div id="slider-row">
          <input id="page-slider" type="range" min="1" max="1" step="1" value="1" aria-label="Geser ke halaman">
        </div>
        <nav class="controls">
          <button id="btn-close" class="ctl">Kembali</button>
          <button id="btn-home-reader" class="ctl" aria-label="Kembali ke layar awal"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
          <button id="btn-first" class="ctl" aria-label="Ke halaman awal">&#124;&#9664;</button>
          <button id="btn-prev" class="ctl" aria-label="Halaman sebelumnya">&#9664;</button>
          <button id="page-info" class="ctl" aria-label="Pilih nomor halaman">–</button>
          <button id="btn-next" class="ctl" aria-label="Halaman berikutnya">&#9654;</button>
          <button id="btn-last" class="ctl" aria-label="Ke halaman akhir">&#9654;&#124;</button>
        </nav>

        <!-- Papan angka di layar untuk lompat ke nomor halaman -->
        <div id="goto" class="goto hidden" role="dialog" aria-label="Lompat ke halaman">
          <div class="goto-card">
            <div class="goto-display"><span id="goto-val"></span><span id="goto-total"></span></div>
            <div class="goto-pad" id="goto-pad">
              <button class="ctl" data-k="1">1</button><button class="ctl" data-k="2">2</button><button class="ctl" data-k="3">3</button>
              <button class="ctl" data-k="4">4</button><button class="ctl" data-k="5">5</button><button class="ctl" data-k="6">6</button>
              <button class="ctl" data-k="7">7</button><button class="ctl" data-k="8">8</button><button class="ctl" data-k="9">9</button>
              <button class="ctl" data-k="back" aria-label="Hapus">&#9003;</button><button class="ctl" data-k="0">0</button><button class="ctl goto-go" data-k="go">Buka</button>
            </div>
            <button id="goto-cancel" class="ctl">Batal</button>
          </div>
        </div>
      </section>

      <div id="status" class="status hidden">
        <p id="status-text"></p>
        <button id="status-back" class="ctl" hidden>Kembali</button>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="naskah/parts.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
